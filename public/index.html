<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Masuk — Realtime Chat</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: radial-gradient(
          1200px 600px at 50% -10%,
          #1b2130 0%,
          #0b0d12 60%
        );
        color: #e7eaf0;
        padding: 24px;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 420px;
        background: #171b25;
        border: 1px solid #232936;
        border-radius: 22px;
        padding: 36px 28px;
        box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.6);
      }
      .logo {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #6c8cff, #a06cff);
        font-size: 26px;
        margin-bottom: 18px;
      }
      h1 {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.02em;
        margin-bottom: 6px;
      }
      .sub {
        color: #8a93a6;
        font-size: 14px;
        line-height: 1.55;
        margin-bottom: 22px;
      }
      .invite {
        background: linear-gradient(
          135deg,
          rgba(108, 140, 255, 0.15),
          rgba(160, 108, 255, 0.15)
        );
        border: 1px solid rgba(108, 140, 255, 0.4);
        border-radius: 12px;
        padding: 12px 14px;
        font-size: 13px;
        margin-bottom: 18px;
        color: #c9d3ff;
      }
      .invite b {
        color: #fff;
        letter-spacing: 0.15em;
      }
      .hidden {
        display: none;
      }
      .input-wrap {
        display: flex;
        align-items: center;
        gap: 8px;
        background: #12151d;
        border: 1px solid #232936;
        border-radius: 12px;
        padding: 0 14px;
        transition: 0.15s;
      }
      .input-wrap:focus-within {
        border-color: #6c8cff;
      }
      .input-wrap span {
        color: #8a93a6;
        font-size: 15px;
      }
      .input-wrap input {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        color: #e7eaf0;
        font-size: 15px;
        padding: 14px 0;
        font-family: inherit;
      }
      button {
        width: 100%;
        margin-top: 14px;
        padding: 14px;
        border-radius: 12px;
        border: none;
        background: #6c8cff;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
        transition: 0.15s;
      }
      button:hover {
        background: #8aa2ff;
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .status {
        margin-top: 14px;
        font-size: 13px;
        text-align: center;
        color: #8a93a6;
        min-height: 18px;
      }
      .status.err {
        color: #f87171;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">💬</div>
      <h1>Masuk</h1>
      <p class="sub">Pilih username. Halamanmu akan dibuat otomatis.</p>

      <div id="inviteBanner" class="invite hidden">
        🎟️ Kamu diundang ke room <b id="inviteCode"></b>
      </div>

      <form id="form">
        <div class="input-wrap">
          <span>@</span>
          <input
            id="username"
            placeholder="username"
            maxlength="20"
            autocomplete="off"
            spellcheck="false"
          />
        </div>
        <button type="submit" id="submitBtn">Masuk →</button>
      </form>
      <p id="status" class="status"></p>
    </div>

    <script>
      const params = new URLSearchParams(location.search);
      const joinCode = (params.get("join") || "").toUpperCase();
      if (joinCode) {
        document.getElementById("inviteBanner").classList.remove("hidden");
        document.getElementById("inviteCode").textContent = joinCode;
      }

      const usernameInput = document.getElementById("username");
      usernameInput.addEventListener("input", () => {
        usernameInput.value = usernameInput.value
          .toLowerCase()
          .replace(/[^a-z0-9_]/g, "");
      });

      const form = document.getElementById("form");
      const status = document.getElementById("status");
      const submitBtn = document.getElementById("submitBtn");

      form.onsubmit = async (e) => {
        e.preventDefault();
        const username = usernameInput.value.trim();
        if (username.length < 3) {
          status.textContent = "Username minimal 3 karakter";
          status.className = "status err";
          return;
        }
        submitBtn.disabled = true;
        submitBtn.textContent = "Memuat...";
        try {
          const r = await fetch("/api/register", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, room: joinCode }),
          });
          const data = await r.json();
          if (!r.ok) throw new Error(data.error || "Gagal mendaftar");
          location.href = data.url;
        } catch (err) {
          status.textContent = err.message;
          status.className = "status err";
          submitBtn.disabled = false;
          submitBtn.textContent = "Masuk →";
        }
      };

      usernameInput.focus();
    </script>
  </body>
</html>
